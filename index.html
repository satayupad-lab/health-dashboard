<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>แดชบอร์ดสุขภาพส่วนตัว</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: summary KPIs first, then two trend charts, then the day-by-day log. */
:root {
  --bg: #f4f8f7;
  --surface: #ffffff;
  --fg: #14211f;
  --muted: #5a6a67;
  --line: #dbe5e2;
  --grid: #e5ece9;
  --ex: #0f8a6a;
  --sl: #5557c9;
  --wa: #0b86b3;
  --ok: #0f7a4f;
  --ok-bg: #e0f2e8;
  --warn: #a8480a;
  --warn-bg: #fdebd0;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716; --surface: #172220; --fg: #e8f1ef; --muted: #9db0ac;
    --line: #27403b; --grid: #223532;
    --ex: #3fcf9f; --sl: #a0a2ff; --wa: #4cc3ee;
    --ok: #5fd49b; --ok-bg: #14382a; --warn: #f3b25a; --warn-bg: #3d2d10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716; --surface: #172220; --fg: #e8f1ef; --muted: #9db0ac;
  --line: #27403b; --grid: #223532;
  --ex: #3fcf9f; --sl: #a0a2ff; --wa: #4cc3ee;
  --ok: #5fd49b; --ok-bg: #14382a; --warn: #f3b25a; --warn-bg: #3d2d10;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.9rem; }
.coverage { font-size: 0.85rem; color: var(--muted); }
.coverage b { color: var(--fg); font-weight: 600; }

h2 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 600; }
.hint { margin: 0 0 12px; color: var(--muted); font-size: 0.85rem; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kpi .label { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.kpi .value { font-size: 2.1rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.kpi .value small { font-size: 0.95rem; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi .ref { font-size: 0.8rem; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; }

.chip { display: inline-block; align-self: flex-start; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 12px; min-width: 0; }
.panel svg { width: 100%; height: auto; display: block; }
.grid { stroke: var(--grid); stroke-width: 1; }
.ax { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
.refline { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.reflabel { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.val { font-size: 11px; font-weight: 600; font-family: var(--font); }

.log { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 110px minmax(0, 1.3fr) minmax(0, 2fr); gap: 8px 18px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.date { display: flex; flex-direction: column; line-height: 1.25; }
.date b { font-size: 1rem; font-weight: 600; }
.date span { font-size: 0.8rem; color: var(--muted); }
.act { display: flex; align-items: center; gap: 10px; min-width: 0; }
.act strong { font-weight: 600; }
.act .min { color: var(--muted); font-size: 0.88rem; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
.stat .dot { width: 8px; height: 8px; }
.empty { color: var(--muted); font-size: 0.88rem; }
.row.pending { background: transparent; }
.row.pending .date b { color: var(--muted); font-weight: 500; }

.foot { color: var(--muted); font-size: 0.8rem; }

@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; gap: 6px; }
  .date { flex-direction: row; align-items: baseline; gap: 8px; }
  h1 { font-size: 1.5rem; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>แดชบอร์ดสุขภาพส่วนตัว</h1>
      <div class="sub num" id="range"></div>
    </div>
    <div class="coverage num" id="coverage"></div>
  </header>

  <section aria-labelledby="kpi-h">
    <h2 id="kpi-h">สรุปประจำสัปดาห์</h2>
    <p class="hint">ค่าเฉลี่ยคิดจากวันที่มีบันทึกเท่านั้น</p>
    <div class="kpis" id="kpis"></div>
  </section>

  <section aria-labelledby="chart-h">
    <h2 id="chart-h">แนวโน้ม 7 วัน</h2>
    <p class="hint">เส้นประคือเกณฑ์อ้างอิง วันที่ยังไม่มีข้อมูลเว้นว่างไว้</p>
    <div class="charts">
      <div class="panel"><h2 style="font-size:.95rem">ชั่วโมงนอน</h2><div id="chart-sleep"></div></div>
      <div class="panel"><h2 style="font-size:.95rem">ปริมาณน้ำที่ดื่ม</h2><div id="chart-water"></div></div>
    </div>
  </section>

  <section aria-labelledby="log-h">
    <h2 id="log-h">กิจกรรมรายวัน</h2>
    <ul class="log" id="log"></ul>
  </section>

  <p class="foot num" id="foot"></p>
</div>

<script>
/* ---- ข้อมูล: เพิ่มวันที่เหลือโดยเติมรายการใน WEEK ---- */
var WEIGHT = 85;          // กก.
var GOAL_DAYS = 5;        // วัน/สัปดาห์
var WHO_MIN = 150;        // นาที/สัปดาห์ (ออกกำลังกายระดับปานกลาง)
var SLEEP_MIN = 7;        // ชม. ต่ำสุดที่แนะนำสำหรับผู้ใหญ่ (7-9)
var WATER_TARGET = Math.round(WEIGHT * 30) / 1000; // 30 มล./กก. = 2.55 ล.

var WEEK = [
  { label: "7 ก.ย.",  dow: "จันทร์",   short: "จ.",  rec: { act: "วิ่ง",       min: 30, sleep: 7.2, water: 1.8 } },
  { label: "8 ก.ย.",  dow: "อังคาร",   short: "อ.",  rec: { act: "ปั่นจักรยาน", min: 45, sleep: 6.5, water: 1.5 } },
  { label: "9 ก.ย.",  dow: "พุธ",      short: "พ.",  rec: null },
  { label: "10 ก.ย.", dow: "พฤหัสบดี", short: "พฤ.", rec: null },
  { label: "11 ก.ย.", dow: "ศุกร์",    short: "ศ.",  rec: null },
  { label: "12 ก.ย.", dow: "เสาร์",    short: "ส.",  rec: null },
  { label: "13 ก.ย.", dow: "อาทิตย์",  short: "อา.", rec: null }
];

var recs = WEEK.filter(function (d) { return d.rec; }).map(function (d) { return d.rec; });
function sum(a, k) { return a.reduce(function (s, r) { return s + r[k]; }, 0); }
var exDays = recs.filter(function (r) { return r.min > 0; }).length;
var totalMin = sum(recs, "min");
var avgSleep = recs.length ? sum(recs, "sleep") / recs.length : 0;
var avgWater = recs.length ? sum(recs, "water") / recs.length : 0;
function f1(v) { return v.toFixed(1); }
function f2(v) { return v.toFixed(2); }
function pct(v) { return Math.max(0, Math.min(100, v * 100)); }

document.getElementById("range").textContent =
  WEEK[0].label + " – " + WEEK[6].label + " 2026 · น้ำหนักตัว " + WEIGHT + " กก.";
document.getElementById("coverage").innerHTML = "บันทึกแล้ว <b>" + recs.length + "</b> จาก 7 วัน";

/* ---- KPI ---- */
function chip(ok, okText, warnText) {
  return '<span class="chip ' + (ok ? "ok" : "warn") + '">' + (ok ? okText : warnText) + "</span>";
}
var kpis = [
  { color: "var(--ex)", label: "วันที่ออกกำลังกาย",
    value: exDays, unit: "/ " + GOAL_DAYS + " วัน", ratio: exDays / GOAL_DAYS,
    ref: "เป้าหมาย " + GOAL_DAYS + " วันต่อสัปดาห์" },
  { color: "var(--ex)", label: "เวลาออกกำลังกายรวม",
    value: totalMin, unit: "นาที", ratio: totalMin / WHO_MIN,
    ref: "เกณฑ์ WHO อย่างน้อย " + WHO_MIN + " นาทีต่อสัปดาห์" },
  { color: "var(--sl)", label: "ชั่วโมงนอนเฉลี่ย",
    value: f2(avgSleep), unit: "ชม./คืน", ratio: avgSleep / 9,
    chip: chip(avgSleep >= SLEEP_MIN, "อยู่ในเกณฑ์", "ต่ำกว่า " + SLEEP_MIN + " ชม."),
    ref: "ผู้ใหญ่ควรนอน 7–9 ชม." },
  { color: "var(--wa)", label: "ปริมาณน้ำเฉลี่ย",
    value: f2(avgWater), unit: "ลิตร/วัน", ratio: avgWater / WATER_TARGET,
    chip: chip(avgWater >= WATER_TARGET, "ถึงเป้า", "ต่ำกว่าเป้า"),
    ref: "เป้า ≈ " + f2(WATER_TARGET) + " ลิตร (30 มล. × " + WEIGHT + " กก.)" }
];
document.getElementById("kpis").innerHTML = kpis.map(function (k) {
  return '<div class="kpi"><div class="label"><span class="dot" style="background:' + k.color + '"></span>' + k.label + '</div>' +
    '<div class="value num">' + k.value + '<small>' + k.unit + '</small></div>' +
    '<div class="bar" aria-hidden="true"><i style="width:' + pct(k.ratio) + '%;background:' + k.color + '"></i></div>' +
    (k.chip || "") + '<div class="ref">' + k.ref + '</div></div>';
}).join("");

/* ---- กราฟเส้น ---- */
function lineChart(elId, o) {
  var W = 360, H = 220, L = 34, R = 12, T = 20, B = 30;
  function x(i) { return L + (W - L - R) * (i + 0.5) / 7; }
  function y(v) { return T + (H - T - B) * (1 - (v - o.min) / (o.max - o.min)); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + o.aria + '">';
  if (o.band) {
    s += '<rect x="' + L + '" y="' + y(o.band[1]) + '" width="' + (W - L - R) + '" height="' + (y(o.band[0]) - y(o.band[1])) +
      '" fill="' + o.color + '" opacity="0.10"/>';
  }
  o.ticks.forEach(function (t) {
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
      '<text class="ax" x="' + (L - 6) + '" y="' + (y(t) + 3.5) + '" text-anchor="end">' + t + '</text>';
  });
  s += '<line class="refline" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.ref) + '" y2="' + y(o.ref) + '"/>' +
    '<text class="reflabel" x="' + (W - R - 2) + '" y="' + (y(o.ref) - 5) + '" text-anchor="end">' + o.refLabel + '</text>';
  var path = "";
  WEEK.forEach(function (d, i) {
    if (d.rec && WEEK[i + 1] && WEEK[i + 1].rec) {
      path += (path ? "" : "") + 'M' + x(i) + ' ' + y(d.rec[o.key]) + ' L' + x(i + 1) + ' ' + y(WEEK[i + 1].rec[o.key]) + ' ';
    }
  });
  if (path) s += '<path d="' + path + '" fill="none" stroke="' + o.color + '" stroke-width="2.5" stroke-linecap="round"/>';
  WEEK.forEach(function (d, i) {
    s += '<text class="ax" x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle" opacity="' + (d.rec ? 1 : 0.55) + '">' + d.short + '</text>';
    if (d.rec) {
      var v = d.rec[o.key];
      s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4.5" fill="' + o.color + '" stroke="var(--surface)" stroke-width="2"/>' +
        '<text class="val" x="' + x(i) + '" y="' + (y(v) - 10) + '" text-anchor="middle" fill="' + o.color + '">' + f1(v) + '</text>';
    } else {
      s += '<circle cx="' + x(i) + '" cy="' + y(o.min) + '" r="2" fill="var(--grid)"/>';
    }
  });
  s += "</svg>";
  document.getElementById(elId).innerHTML = s;
}
lineChart("chart-sleep", {
  key: "sleep", min: 4, max: 10, ticks: [4, 6, 8, 10], ref: SLEEP_MIN, refLabel: "ขั้นต่ำ 7 ชม.",
  band: [7, 9], color: "var(--sl)", aria: "กราฟเส้นชั่วโมงนอนต่อคืน 7 วัน เทียบเกณฑ์ 7 ถึง 9 ชั่วโมง"
});
lineChart("chart-water", {
  key: "water", min: 0, max: 3.5, ticks: [0, 1, 2, 3], ref: WATER_TARGET, refLabel: "เป้า " + f2(WATER_TARGET) + " ล.",
  color: "var(--wa)", aria: "กราฟเส้นปริมาณน้ำดื่มต่อวัน 7 วัน เทียบเป้า " + f2(WATER_TARGET) + " ลิตร"
});

/* ---- รายการรายวัน ---- */
document.getElementById("log").innerHTML = WEEK.map(function (d) {
  var head = '<div class="date num"><b>' + d.label + '</b><span>' + d.dow + '</span></div>';
  if (!d.rec) {
    return '<li class="row pending">' + head + '<div class="empty" style="grid-column: span 2">ยังไม่มีข้อมูล</div></li>';
  }
  var r = d.rec;
  return '<li class="row">' + head +
    '<div class="act"><span class="dot" style="background:var(--ex)"></span><div><strong>' + r.act +
    '</strong> <span class="min num">' + r.min + ' นาที</span></div></div>' +
    '<div class="stats num">' +
      '<span class="stat"><span class="dot" style="background:var(--sl)"></span>นอน ' + f1(r.sleep) + ' ชม. ' +
        chip(r.sleep >= SLEEP_MIN, "ปกติ", "น้อย") + '</span>' +
      '<span class="stat"><span class="dot" style="background:var(--wa)"></span>น้ำ ' + f1(r.water) + ' ล. ' +
        chip(r.water >= WATER_TARGET, "ถึงเป้า", "ต่ำกว่าเป้า") + '</span>' +
    '</div></li>';
}).join("");

document.getElementById("foot").textContent =
  "เกณฑ์อ้างอิงทั่วไป: ออกกำลังกายระดับปานกลาง 150 นาที/สัปดาห์ (WHO), นอน 7–9 ชม./คืน, น้ำประมาณ 30 มล. ต่อน้ำหนักตัว 1 กก. เพื่อภาพรวม ไม่ใช่คำแนะนำทางการแพทย์";
</script>

</body></html>
